ixG8AAANIAAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVf/zYsRvAAADSAAAAABVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/82DEcAAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/82LEbwAAA0gAAAAAVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV';

// Technische Platzhalter-Auflösung: nicht bearbeiten.
const cfg = window.CONTENT;
cfg.audio = cfg.audio || DEMO_MP3;
cfg.seal = cfg.seal || PLACEHOLDERS[5];
for (const [key,index] of Object.entries({webtoon:0,giftcard:4,sketchbook:6,vinyl:1})) cfg.covers[key] ||= PLACEHOLDERS[index];
cfg.giftcards = cfg.giftcards.map(src => src || PLACEHOLDERS[4]);
cfg.comic = cfg.comic.map(src => src || PLACEHOLDERS[3]);
cfg.sketchPages = cfg.sketchPages.map(page => page.map(src => src || PLACEHOLDERS[2]));
cfg.treats = cfg.treats.map(item => ({...item, image:item.image || PLACEHOLDERS[7]}));

/* 3. NAVIGATION UND ANIMATIONEN */
let opening=false, navigationToken=0;
const pause = ms => new Promise(resolve=>setTimeout(resolve,window.matchMedia('(prefers-reduced-motion: reduce)').matches?20:ms));
function render(){
 navigationToken++;opening=false;
 document.body.classList.remove('opening-scene','leaving');
document.querySelectorAll('audio').forEach(a=>a.pause());
document.querySelector('.record-theatre')?.remove();
const C = window.CONTENT;
const app = document.querySelector('#app');
const route = location.hash.slice(1) || 'home';
const view = route.split('?')[0];
document.body.dataset.view = view;
// Apply the mood on every navigation, including browser Back and direct links.

const mood=window.PAGE_MOODS[view]||window.PAGE_MOODS.home;
['bg','wash','ink','muted','accent','motif'].forEach((key,i)=>document.body.style.setProperty('--'+key,mood[i]));
document.documentElement.style.backgroundColor=mood[0];
document.body.style.background=`radial-gradient(ellipse at 12% 12%, ${mood[1]}, transparent 58%), ${mood[0]}`;
document.body.style.backgroundAttachment='fixed';
document.body.style.color=mood[2];
document.querySelectorAll('.heart-sky span').forEach(star => { star.textContent = view==='webtoon' ? '✦' : '♡'; });
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pic = (src, cls='', alt='') => `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}">`;
const back = (url='#home') => `<a class="back" href="${url}">← zurück</a>`;
const heading = (title,sub='') => `<header><p class="eyebrow">a little world, just for you</p><h1 tabindex="-1">${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}</header>`;
function object(type) {
 if(type==='letters') return `<span class="object envelope"><span class="env-back"></span><span class="note"></span><span class="fold left-fold"></span><span class="fold right-fold"></span><span class="fold bottom-fold"></span><span class="flap"></span>${pic(C.seal,'seal')}</span>`;
 if(['webtoon','sketchbook'].includes(type)) return `<span class="object book ${type}"><span class="pages"></span><span class="inner-page"></span><span class="cover">${pic(C.covers[type])}</span></span>`;
 if(type==='giftcard') return `<span class="object gift"><span class="gift-face">${pic(C.covers.giftcard)}</span></span>`;
 if(type==='treats') return `<span class="object candy"><span class="wrapper wl"></span><span class="sweet">♡</span><span class="wrapper wr"></span></span>`;
 return `<span class="object record"><span class="disc"></span><span class="sleeve">${pic(C.covers.vinyl)}</span></span>`;
}
const names={letters:'Letters',webtoon:'Webtoon',giftcard:'Giftcard',sketchbook:'Tiny sketchbook',treats:'Little treats',vinyl:'Our soundtrack'};
function link(type,label=names[type],href=`#${type}`) {return `<a href="${href}" class="keepsake ${type}-link" data-open="${type}" aria-label="${esc(label)} öffnen">${object(type)}<span class="label">${esc(label)}</span></a>`;}
if(view==='home') app.innerHTML=heading('Happy Birthday<br><em>my love.</em>','For you, always.')+`<section class="collection" aria-label="Deine Sammlung">${Object.keys(names).map(t=>link(t)).join('')}</section>`;
if(view==='letters') app.innerHTML=back()+heading('Letters','For every version of your day.')+`<section class="letter-grid">${C.letters.map((l,i)=>link('letters',l.title,`#letter?id=${i}`)).join('')}</section>`;
if(view==='letter') {
 const id=Number(new URLSearchParams(route.split('?')[1] || '').get('id')||0);const l=C.letters[id];
 app.innerHTML=back('#letters')+(l?`<article class="letter-paper"><p class="eyebrow">a letter for you</p><h1 tabindex="-1">${esc(l.title)}</h1><div class="letter-text">${esc(l.text)}</div>${l.image?pic(l.image,'letter-image','Dein Brief'):''}<span class="signature">♡</span></article>`:heading('Brief nicht gefunden'));
}
if(view==='webtoon') app.innerHTML=back()+heading('Webtoon')+`<section class="comic" aria-label="Comic">${C.comic.map((src,i)=>pic(src,'',`Comic-Panel ${i+1}`)).join('')}</section>`;
if(view==='giftcard') app.innerHTML=back()+heading('Something just for you.')+`<div class="gift-duo">${(C.giftcards || [C.covers.giftcard,C.covers.giftcard]).slice(0,2).map((src,i)=>`<div class="landscape-gift" style="--gift-i:${i}">${pic(src,'',`Gutschein ${i+1}`)}</div>`).join('')}</div>`;
function turntable() {return `<div class="player-perspective"><div class="turntable"><div class="player-lid"><span>for you ♡</span></div><div class="deck"><div class="platter"></div><div class="disc player-record"></div><div class="tonearm"><i></i></div><div class="power-light"></div><span class="deck-name">OUR SOUNDTRACK</span></div><div class="deck-front"></div><div class="deck-side"></div><div class="record-jacket">${pic(C.covers.vinyl)}</div></div></div>`;}
if(view==='vinyl') {
 app.innerHTML=back()+heading('Our soundtrack.','One more song. Just us.')+`<section class="record-room ready">${turntable()}</section><div class="audio-panel"><p>${C.audio===DEMO_MP3?'Music-box demo · deine MP3 kannst du später einsetzen':'Unser Lied'}</p><audio controls preload="metadata" src="${esc(C.audio)}" aria-label="Musik abspielen oder pausieren"></audio><p id="audio-status" role="status"></p><label class="audio-upload">Eigene MP3 auswählen<input id="audio-file" type="file" accept="audio/mpeg,.mp3"></label></div>`;
 const audio=app.querySelector('audio'); const room=app.querySelector('.record-room');
 audio.addEventListener('play',()=>room.classList.add('playing'));
 ['pause','ended'].forEach(event=>audio.addEventListener(event,()=>room.classList.remove('playing')));
 audio.addEventListener('error',()=>{document.querySelector('#audio-status').textContent='Die Audiodatei konnte nicht geladen werden. Wähle eine MP3 aus.';});
 document.querySelector('#audio-file').onchange=e=>{const file=e.target.files[0];if(!file)return;audio.pause();if(window.localAudioURL)URL.revokeObjectURL(window.localAudioURL);window.localAudioURL=URL.createObjectURL(file);audio.src=window.localAudioURL;audio.load();document.querySelector('#audio-status').textContent=file.name+' · bereit zum Abspielen';};
}
if(view==='sketchbook') {
 let page=0,busy=false;
 app.innerHTML=back()+heading('Tiny sketchbook')+`<div class="spread" aria-label="Skizzenbuch"><div id="left-page" class="sketch-page"></div><div id="right-page" class="sketch-page"></div><div class="curl-sheet" aria-hidden="true"></div></div><nav class="page-controls" aria-label="Buchseiten"><button id="prev">← Zurück</button><span id="page-count" aria-live="polite"></span><button id="next">Weiter →</button></nav>`;
 const pages=C.sketchPages, spread=app.querySelector('.spread'),left=app.querySelector('#left-page'),right=app.querySelector('#right-page'),sheet=app.querySelector('.curl-sheet'),prev=app.querySelector('#prev'),next=app.querySelector('#next'),count=app.querySelector('#page-count');
 const markup=n=>(pages[n]||[]).map((src,i)=>pic(src,'',`Zeichnung ${i+1} auf Seite ${n+1}`)).join('');
 function paint(){left.innerHTML=markup(page);right.innerHTML=markup(page+1);count.textContent=`${page+1}–${Math.min(page+2,pages.length)} / ${pages.length}`;prev.disabled=busy||page===0;next.disabled=busy||page+2>=pages.length;}
 async function turn(dir){
  if(busy||page+dir*2<0||page+dir*2>=pages.length)return;
  busy=true;paint();const dest=page+dir*2,N=14;
  const front=dir>0?page+1:dest+1,backPage=dir>0?dest:page;
  if(dir>0)right.innerHTML=markup(dest+1);else left.innerHTML=markup(dest);
  sheet.innerHTML=Array.from({length:N},(_,i)=>`<div class="curl-strip"><div class="curl-face"><div class="sketch-page sheet-art" style="left:${-i*100}%">${markup(front)}</div></div><div class="curl-face curl-back"><div class="sketch-page sheet-art" style="left:${-(N-1-i)*100}%">${markup(backPage)}</div></div></div>`).join('');
  sheet.style.setProperty('--strips',N);sheet.hidden=false;sheet.style.display='block';
  const strips=[...sheet.children],width=spread.clientWidth/2,step=width/N;
  const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:1200;
  await new Promise(resolve=>{let start;function frame(now){if(!sheet.isConnected){resolve();return;}if(start===undefined)start=now;const t=duration?Math.min((now-start)/duration,1):1;const ease=t*t*(3-2*t);const progress=dir>0?ease:1-ease;let x=0,z=0;
   strips.forEach((strip,i)=>{const angle=-Math.PI*progress+Math.sin(Math.PI*progress)*.95*(i/N-.5);strip.style.width=(step+.35)+'px';strip.style.transform=`translate3d(${x}px,0,${z}px) rotateY(${angle}rad)`;x+=step*Math.cos(angle);z-=step*Math.sin(angle);});
   if(t<1)requestAnimationFrame(frame);else resolve();}requestAnimationFrame(frame);});
  if(!sheet.isConnected)return;page=dest;busy=false;paint();sheet.style.display='none';sheet.innerHTML='';
 }
 prev.onclick=()=>turn(-1);next.onclick=()=>turn(1);paint();
}
if(view==='treats') app.innerHTML=back()+heading('Little treats','Pick a sweet little surprise.')+`<button class="motion-toggle" id="float-toggle" aria-pressed="false">Schweben pausieren</button><section class="treat-cloud" aria-label="Kleine Überraschungen">${C.treats.map((t,i)=>`<div class="treat-orbit" style="--i:${i};--delay:-${i*1.2}s"><button class="treat-flip" aria-label="${esc(t.title)} aufdecken" aria-pressed="false"><span class="treat-front">${object('treats')}</span><span class="treat-back">${pic(t.image,'',t.title)}</span></button></div>`).join('')}</section>`;
document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',async e=>{
 if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||e.button!==0)return;
 e.preventDefault();if(opening)return;opening=true;
 const token=++navigationToken;
 el.classList.add('opening');document.body.classList.add('opening-scene');
 if(el.dataset.open==='vinyl'){
 const theatre=document.createElement('div');theatre.className='record-theatre';theatre.setAttribute('aria-hidden','true');theatre.innerHTML=turntable();document.body.append(theatre);await pause(4600);
}else{await pause(2100);}
 if(token!==navigationToken)return;
 document.body.classList.add('leaving');await pause(310);
 if(token!==navigationToken)return;
 location.hash=el.getAttribute('href');
}));
document.querySelectorAll('.treat-flip').forEach(b=>b.onclick=()=>{const flipped=b.classList.toggle('flipped');b.setAttribute('aria-pressed',flipped);});
function motionToggle(id,target,off,on){const b=document.querySelector(id);if(b)b.onclick=()=>{const paused=document.querySelector(target).classList.toggle('paused');b.setAttribute('aria-pressed',paused);b.textContent=paused?on:off;};}
motionToggle('#record-toggle','.vinyl-disc','Drehung pausieren','Drehung starten');motionToggle('#float-toggle','.treat-cloud','Schweben pausieren','Schweben starten');
document.title=(names[view]|| (view==='letter'?'Dein Brief':'Just for you'))+' · For you';

}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true});});
window.addEventListener('pageshow',()=>{document.querySelector('.record-theatre')?.remove();document.body.classList.remove('opening-scene','leaving');opening=false;});
render();



</script>
</body>
</html>
