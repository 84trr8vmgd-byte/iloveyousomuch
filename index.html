<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Eine interaktive Sammlung aus What-if-Briefen, Comics, Zeichnungen und kleinen Geschenken."
    />
    <title>What if …</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c77b66'/%3E%3Cpath d='M12 20h40v27H12z' fill='%23fff7ee'/%3E%3Cpath d='m12 20 20 17 20-17' fill='none' stroke='%2376463d' stroke-width='4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="collection" aria-labelledby="page-title">
      <header class="intro">
        <p class="eyebrow">just for you</p>
        <h1 id="page-title">What if …</h1>
        <p>Öffne einen Brief oder blättere in einem kleinen Buch.</p>
      </header>

      <section class="shelf" aria-label="Briefe und Bücher">
        <button class="keepsake letter-card tilt-left" data-kind="letter" data-page="rainy-day" aria-label="Brief öffnen: What if it rains">
          <span class="object envelope" aria-hidden="true">
            <span class="paper-peek"></span>
            <span class="envelope-back"></span>
            <span class="envelope-letter">for a rainy day</span>
            <span class="envelope-front"></span>
            <span class="envelope-flap"></span>
            <span class="stamp-placeholder">PNG</span>
          </span>
          <span class="item-title">What if it rains?</span>
          <span class="item-type">LETTER 01</span>
        </button>

        <button class="keepsake book-card rise" data-kind="book" data-page="our-webtoon" aria-label="Buch öffnen: Our little webtoon">
          <span class="object book book-rose" aria-hidden="true">
            <span class="book-pages"></span>
            <span class="book-cover">
              <span class="cover-mark">✦</span>
              <span>our little<br />webtoon</span>
            </span>
          </span>
          <span class="item-title">Our little webtoon</span>
          <span class="item-type">COMIC 01</span>
        </button>

        <button class="keepsake letter-card tilt-right" data-kind="letter" data-page="miss-me" aria-label="Brief öffnen: When you miss me">
          <span class="object envelope envelope-coral" aria-hidden="true">
            <span class="paper-peek"></span>
            <span class="envelope-back"></span>
            <span class="envelope-letter">open when you miss me</span>
            <span class="envelope-front"></span>
            <span class="envelope-flap"></span>
            <span class="stamp-placeholder">PNG</span>
          </span>
          <span class="item-title">When you miss me</span>
          <span class="item-type">LETTER 02</span>
        </button>

        <button class="keepsake book-card tilt-left" data-kind="book" data-page="sketchbook" aria-label="Buch öffnen: Tiny sketchbook">
          <span class="object book book-blue" aria-hidden="true">
            <span class="book-pages"></span>
            <span class="book-cover">
              <span class="cover-mark">☾</span>
              <span>tiny<br />sketchbook</span>
            </span>
          </span>
          <span class="item-title">Tiny sketchbook</span>
          <span class="item-type">DRAWINGS 01</span>
        </button>

        <button class="keepsake letter-card rise" data-kind="letter" data-page="need-a-smile" aria-label="Brief öffnen: When you need a smile">
          <span class="object envelope envelope-sand" aria-hidden="true">
            <span class="paper-peek"></span>
            <span class="envelope-back"></span>
            <span class="envelope-letter">a little smile for you</span>
            <span class="envelope-front"></span>
            <span class="envelope-flap"></span>
            <span class="stamp-placeholder">PNG</span>
          </span>
          <span class="item-title">When you need a smile</span>
          <span class="item-type">LETTER 03</span>
        </button>

        <button class="keepsake book-card tilt-right" data-kind="book" data-page="gift-cards" aria-label="Buch öffnen: Little treats">
          <span class="object book book-plum" aria-hidden="true">
            <span class="book-pages"></span>
            <span class="book-cover">
              <span class="cover-mark">♡</span>
              <span>little<br />treats</span>
            </span>
          </span>
          <span class="item-title">Little treats</span>
          <span class="item-type">GIFTCARDS</span>
        </button>
      </section>
    </main>

    <div class="transition-layer" aria-hidden="true">
      <span>opening…</span>
    </div>
  </body>
</html>
